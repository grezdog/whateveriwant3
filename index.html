
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Angry Rabbits</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #87d9ff;
  text-align: center;
  color: #25334a;
}
header {
  padding: 12px;
  background: #fff4c5;
  border-bottom: 3px solid #e8c56d;
}
h1 { margin: 2px 0 6px; color: #ed6633; }
#stats { font-weight: bold; }
#gameWrap {
  position: relative;
  width: min(100%, 1100px);
  margin: auto;
}
canvas {
  display: block;
  width: 100%;
  height: auto;
  background: #a8e4ff;
  touch-action: none;
}
#message {
  display: none;
  position: absolute;
  inset: 20% 8% auto;
  padding: 22px;
  background: rgba(255,255,255,.96);
  border: 4px solid #ffbd45;
  border-radius: 20px;
  box-shadow: 0 8px 20px #37566b55;
}
#message h2 { margin: 0 0 8px; color: #ed6633; }
button {
  border: 0;
  border-radius: 12px;
  padding: 11px 17px;
  margin: 5px;
  background: #ff873d;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}
button:hover { background: #ed6328; }
.instructions { padding: 10px; background: #fff; }
</style>
</head>
<body>
<header>
  <h1>🐰 ANGRY RABBITS 🥕</h1>
  <div id="stats">Level 1 | Score: 0 | Rabbits: 3</div>
</header>

<div id="gameWrap">
  <canvas id="game" width="1100" height="620"></canvas>
  <div id="message">
    <h2 id="messageTitle">Great job!</h2>
    <p id="messageText">You did it!</p>
    <button id="messageButton">Next Level</button>
  </div>
</div>

<div class="instructions">
  Drag the rabbit backward on the slingshot, then release to launch!
  Knock down the big carrot towers and free the rabbits hiding inside.
  <br>
  <button onclick="restartLevel()">Restart Level</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const stats = document.getElementById("stats");
const message = document.getElementById("message");
const messageTitle = document.getElementById("messageTitle");
const messageText = document.getElementById("messageText");
const messageButton = document.getElementById("messageButton");

const W = canvas.width, H = canvas.height;
const groundY = 555;
const sling = { x: 145, y: 425 };
const gravity = 0.22;

let level = 1;
let score = 0;
let rabbitsLeft = 3;
let rabbit;
let carrots = [];
let bunnies = [];
let particles = [];
let dragging = false;
let gameOver = false;
let levelWon = false;
let nextShotDelay = 0;
let lastTime = 0;
let animationId;

const levelLayouts = [
  { towers: [
    { x: 650, rows: 4, cols: 3 },
    { x: 840, rows: 5, cols: 3 }
  ]},
  { towers: [
    { x: 600, rows: 5, cols: 3 },
    { x: 800, rows: 6, cols: 3 },
    { x: 965, rows: 3, cols: 2 }
  ]},
  { towers: [
    { x: 565, rows: 6, cols: 3 },
    { x: 760, rows: 7, cols: 3 },
    { x: 950, rows: 5, cols: 3 }
  ]}
];

function makeCarrot(x, y, w=48, h=45) {
  return {
    x, y, w, h,
    vx: 0, vy: 0,
    angle: 0, spin: 0,
    falling: false,
    alive: true,
    hitFlash: 0
  };
}

function makeTower(tower) {
  const blockW = 48, blockH = 45;
  const gap = 3;
  const width = tower.cols * (blockW + gap);
  const left = tower.x;
  for (let row = 0; row < tower.rows; row++) {
    for (let col = 0; col < tower.cols; col++) {
      const x = left + col * (blockW + gap);
      const y = groundY - blockH - row * (blockH + gap);
      carrots.push(makeCarrot(x, y, blockW, blockH));
    }
  }

  // A rabbit is safely tucked into a gap near the middle of each tower.
  const midRow = Math.max(1, Math.floor(tower.rows * 0.55));
  const midCol = Math.floor(tower.cols / 2);
  bunnies.push({
    x: left + midCol * (blockW + gap) + blockW/2,
    y: groundY - blockH - midRow * (blockH + gap) + blockH/2,
    rescued: false,
    towerX: left
  });

  // Add a carrot roof so each tower looks large and complete.
  if (tower.cols >= 3) {
    carrots.push(makeCarrot(left + (tower.cols-1)*(blockW+gap)/2,
      groundY - tower.rows*(blockH+gap) - 48, 48, 45));
  }
}

function setupLevel() {
  carrots = [];
  bunnies = [];
  particles = [];
  rabbitsLeft = 3;
  dragging = false;
  gameOver = false;
  levelWon = false;
  nextShotDelay = 0;
  message.style.display = "none";

  const layout = levelLayouts[Math.min(level - 1, levelLayouts.length - 1)];
  layout.towers.forEach(makeTower);
  createRabbit();
  updateStats();
}

function createRabbit() {
  rabbit = {
    x: sling.x, y: sling.y,
    vx: 0, vy: 0,
    r: 21,
    flying: false,
    alive: true,
    hitSet: new Set()
  };
}

function updateStats() {
  stats.textContent =
    `Level ${level} | Score: ${score} | Rabbits: ${rabbitsLeft}`;
}

function drawBackground() {
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, "#83d8ff");
  sky.addColorStop(1, "#e7faff");
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  // Clouds
  ctx.fillStyle = "rgba(255,255,255,.9)";
  [[170,90],[460,125],[790,75],[980,150]].forEach(([x,y]) => {
    ctx.beginPath();
    ctx.arc(x,y,25,0,Math.PI*2);
    ctx.arc(x+28,y-10,32,0,Math.PI*2);
    ctx.arc(x+57,y,23,0,Math.PI*2);
    ctx.fill();
  });

  // Distant hills
  ctx.fillStyle = "#9bdc8b";
  ctx.beginPath();
  ctx.moveTo(0,470);
  ctx.quadraticCurveTo(250,360,490,470);
  ctx.quadraticCurveTo(780,350,1100,455);
  ctx.lineTo(1100,620); ctx.lineTo(0,620);
  ctx.fill();

  ctx.fillStyle = "#67bd58";
  ctx.fillRect(0, groundY, W, H-groundY);
  ctx.fillStyle = "#399a43";
  ctx.fillRect(0, groundY, W, 8);

  // Grass blades
  ctx.strokeStyle = "#398e3f";
  ctx.lineWidth = 2;
  for (let x=0; x<W; x+=24) {
    ctx.beginPath();
    ctx.moveTo(x, groundY+8);
    ctx.lineTo(x+4, groundY-1);
    ctx.stroke();
  }
}

function drawSlingshot() {
  ctx.lineCap = "round";
  ctx.lineWidth = 12;
  ctx.strokeStyle = "#754522";
  ctx.beginPath();
  ctx.moveTo(sling.x-9, groundY);
  ctx.lineTo(sling.x, sling.y-8);
  ctx.lineTo(sling.x+21, groundY);
  ctx.stroke();

  ctx.lineWidth = 5;
  ctx.strokeStyle = "#a36b37";
  ctx.beginPath();
  ctx.moveTo(sling.x, sling.y-8);
  ctx.lineTo(rabbit.x, rabbit.y);
  ctx.stroke();

  if (!rabbit.flying && rabbit.alive) {
    ctx.beginPath();
    ctx.moveTo(sling.x+3, sling.y-7);
    ctx.lineTo(rabbit.x, rabbit.y);
    ctx.stroke();
  }
}

function drawRabbit(x, y, r, launched=false) {
  ctx.save();
  ctx.translate(x,y);

  // Ears
  ctx.fillStyle = "#f6f0ec";
  ctx.strokeStyle = "#a99d9a";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.ellipse(-r*.35,-r*.85,r*.22,r*.55,-.25,0,Math.PI*2);
  ctx.ellipse(r*.25,-r*.9,r*.22,r*.55,.2,0,Math.PI*2);
  ctx.fill(); ctx.stroke();

  ctx.fillStyle = "#ffb7c6";
  ctx.beginPath();
  ctx.ellipse(-r*.35,-r*.85,r*.10,r*.38,-.25,0,Math.PI*2);
  ctx.ellipse(r*.25,-r*.9,r*.10,r*.38,.2,0,Math.PI*2);
  ctx.fill();

  // Body and face
  ctx.fillStyle = "#f9f5ef";
  ctx.strokeStyle = "#a99d9a";
  ctx.beginPath();
  ctx.arc(0,0,r,0,Math.PI*2);
  ctx.fill(); ctx.stroke();

  ctx.fillStyle = "#26313a";
  ctx.beginPath();
  ctx.arc(-r*.32,-r*.12,2.8,0,Math.PI*2);
  ctx.arc(r*.32,-r*.12,2.8,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle = "#f28e9c";
  ctx.beginPath();
  ctx.moveTo(-4,3); ctx.lineTo(4,3); ctx.lineTo(0,7);
  ctx.closePath(); ctx.fill();

  ctx.strokeStyle = "#51464a";
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(0,7); ctx.lineTo(0,10);
  ctx.moveTo(0,10); ctx.lineTo(-5,12);
  ctx.moveTo(0,10); ctx.lineTo(5,12);
  ctx.stroke();

  if (launched) {
    ctx.fillStyle = "#f3b0bb";
    ctx.beginPath();
    ctx.arc(-r*.58,r*.18,4,0,Math.PI*2);
    ctx.arc(r*.58,r*.18,4,0,Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}

function drawCarrot(c) {
  ctx.save();
  ctx.translate(c.x+c.w/2, c.y+c.h/2);
  ctx.rotate(c.angle);

  // Carrot body
  ctx.fillStyle = c.hitFlash > 0 ? "#ffd16b" : "#f58227";
  ctx.strokeStyle = "#b84c19";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-c.w/2,-c.h/2+3);
  ctx.quadraticCurveTo(0,-c.h/2-5,c.w/2,-c.h/2+3);
  ctx.lineTo(3,c.h/2);
  ctx.quadraticCurveTo(0,c.h/2+4,-3,c.h/2);
  ctx.closePath();
  ctx.fill(); ctx.stroke();

  // Carrot lines
  ctx.strokeStyle = "#d8641e";
  ctx.lineWidth = 2;
  for (let i=0; i<3; i++) {
    ctx.beginPath();
    ctx.moveTo(-c.w*.24+i*5, -c.h*.08+i*8);
    ctx.lineTo(-c.w*.05+i*5, -c.h*.02+i*8);
    ctx.stroke();
  }

  // Green leafy top
  ctx.fillStyle = "#31a84e";
  ctx.beginPath();
  ctx.ellipse(-7,-c.h/2+1,6,11,-.6,0,Math.PI*2);
  ctx.ellipse(0,-c.h/2-4,6,12,0,0,Math.PI*2);
  ctx.ellipse(7,-c.h/2+1,6,11,.6,0,Math.PI*2);
  ctx.fill();
  ctx.restore();
}

function drawBunnies() {
  bunnies.forEach(b => {
    if (!b.rescued) {
      // Tiny rabbit peeking through a gap in the carrot tower.
      drawRabbit(b.x, b.y, 12, false);
      ctx.fillStyle = "#fff";
      ctx.font = "bold 12px Arial";
      ctx.fillText("HELP!", b.x-19, b.y-26);
    }
  });
}

function drawParticles() {
  particles.forEach(p => {
    ctx.globalAlpha = Math.max(0,p.life/35);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
}

function draw() {
  drawBackground();

  // Decorative bushes
  ctx.fillStyle = "#31964b";
  [330,380,420].forEach((x,i) => {
    ctx.beginPath();
    ctx.arc(x,groundY+5,15+i*2,Math.PI,Math.PI*2);
    ctx.fill();
  });

  drawSlingshot();

  carrots.filter(c => c.alive).forEach(drawCarrot);
  drawBunnies();

  if (rabbit.alive) drawRabbit(rabbit.x,rabbit.y,rabbit.r,true);
  drawParticles();

  // Aim line
  if (dragging) {
    ctx.setLineDash([7,7]);
    ctx.strokeStyle = "rgba(255,255,255,.9)";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(rabbit.x,rabbit.y);
    const dx = sling.x-rabbit.x;
    const dy = sling.y-rabbit.y;
    ctx.lineTo(rabbit.x+dx*3.5,rabbit.y+dy*3.5+70);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  ctx.fillStyle = "#245b2a";
  ctx.font = "bold 17px Arial";
  ctx.fillText("FREE THE HIDDEN BUNNIES!", 20, 35);
}

function burst(x,y,color,count=10) {
  for (let i=0;i<count;i++) {
    const a = Math.random()*Math.PI*2;
    const speed = 1+Math.random()*4;
    particles.push({
      x,y,
      vx:Math.cos(a)*speed,
      vy:Math.sin(a)*speed-1,
      life:25+Math.random()*15,
      size:2+Math.random()*4,
      color
    });
  }
}

function hitCarrot(c) {
  if (!c.alive) return;
  const impact = Math.hypot(rabbit.vx,rabbit.vy);

  // A strong hit breaks the carrot. A softer hit knocks it loose.
  if (impact > 2.5) {
    c.alive = false;
    score += 100;
    burst(c.x+c.w/2,c.y+c.h/2,"#ff8a27",14);
  } else {
    c.falling = true;
    c.vx += rabbit.vx*0.55 + (Math.random()-.5)*2;
    c.vy += rabbit.vy*0.35 - 1.5;
    c.spin += (Math.random()-.5)*0.12;
    c.hitFlash = 10;
    score += 25;
  }

  // Rescue a bunny when its hiding spot gets hit.
  bunnies.forEach(b => {
    if (!b.rescued && Math.abs(b.x-(c.x+c.w/2)) < 65 &&
        Math.abs(b.y-(c.y+c.h/2)) < 70) {
      b.rescued = true;
      score += 250;
      burst(b.x,b.y,"#ffb7c6",18);
    }
  });

  rabbit.vx *= 0.82;
  rabbit.vy *= 0.82;
  updateStats();
}

function overlapCircleRect(cx,cy,r,c) {
  const x = Math.max(c.x,Math.min(cx,c.x+c.w));
  const y = Math.max(c.y,Math.min(cy,c.y+c.h));
  const dx = cx-x, dy = cy-y;
  return dx*dx+dy*dy < r*r;
}

function update(dt) {
  const step = Math.min(dt/16.67, 2);

  if (rabbit.flying && rabbit.alive) {
    rabbit.vy += gravity*step;
    rabbit.x += rabbit.vx*step;
    rabbit.y += rabbit.vy*step;

    // Hit carrots. A carrot can be hit again if it survives the first hit.
    for (const c of carrots) {
      if (!c.alive) continue;
      if (overlapCircleRect(rabbit.x,rabbit.y,rabbit.r,c)) {
        const id = carrots.indexOf(c);
        if (!rabbit.hitSet.has(id)) {
          rabbit.hitSet.add(id);
          hitCarrot(c);
          if (c.alive) {
            c.vx += rabbit.vx*0.5;
            c.vy -= 1.5;
            c.falling = true;
          }
        }
      }
    }

    // Ground bounce and roll
    if (rabbit.y+rabbit.r > groundY) {
      rabbit.y = groundY-rabbit.r;
      rabbit.vy *= -0.35;
      rabbit.vx *= 0.78;
      if (Math.abs(rabbit.vy)<1.2) rabbit.vy=0;
    }

    if (rabbit.x > W+80 || rabbit.x < -80 ||
        rabbit.y > H+100 || (Math.abs(rabbit.vx)<0.25 &&
        Math.abs(rabbit.vy)<0.5 && rabbit.y+rabbit.r>=groundY-1)) {
      rabbit.alive = false;
      nextShotDelay = 40;
    }
  }

  // Only carrots hit by the rabbit fall.
  for (const c of carrots) {
    if (!c.alive || !c.falling) continue;
    c.vy += gravity*0.8*step;
    c.x += c.vx*step;
    c.y += c.vy*step;
    c.angle += c.spin*step;
    c.vx *= Math.pow(0.992,step);
    c.spin *= Math.pow(0.99,step);

    if (c.y+c.h > groundY) {
      c.y = groundY-c.h;
      c.vy *= -0.22;
      c.vx *= 0.75;
      c.spin *= 0.5;
      if (Math.abs(c.vy)<0.7) c.vy=0;
    }

    // Falling carrots can smash into other carrots.
    for (const other of carrots) {
      if (other===c || !other.alive || other.falling) continue;
      if (c.x < other.x+other.w && c.x+c.w > other.x &&
          c.y < other.y+other.h && c.y+c.h > other.y) {
        other.falling = true;
        other.vx += c.vx*0.45 + (Math.random()-.5)*1.5;
        other.vy -= 1.2;
        other.spin += (Math.random()-.5)*0.08;
      }
    }

    if (c.x < -150 || c.x > W+150 || c.y > H+150) {
      c.alive = false;
      score += 50;
    }
    if (c.hitFlash>0) c.hitFlash--;
  }

  particles.forEach(p => {
    p.x += p.vx*step;
    p.y += p.vy*step;
    p.vy += 0.12*step;
    p.life -= step;
  });
  particles = particles.filter(p=>p.life>0);

  if (nextShotDelay > 0) {
    nextShotDelay -= step;
    if (nextShotDelay <= 0 && !gameOver && !levelWon) {
      if (carrots.every(c=>!c.alive) ||
          bunnies.every(b=>b.rescued)) {
        winLevel();
      } else if (rabbitsLeft > 0) {
        createRabbit();
      } else {
        endGame();
      }
    }
  }

  // Win as soon as every carrot is destroyed or every hidden bunny is rescued.
  if (!gameOver && !levelWon &&
      (carrots.every(c=>!c.alive) || bunnies.every(b=>b.rescued))) {
    winLevel();
  }

  updateStats();
}

function winLevel() {
  if (levelWon || gameOver) return;
  levelWon = true;
  message.style.display = "block";
  messageTitle.textContent = "🥕 AMAZING JOB! 🐰";
  const messages = [
    "You launched like a champion!",
    "Those carrot towers didn't stand a chance!",
    "You're a legendary rabbit rescuer!"
  ];
  messageText.textContent = messages[(level-1)%messages.length] +
    " You earned points and saved the bunnies!";
  messageButton.textContent = level >= 3 ? "Play Again" : "Next Level";
}

function endGame() {
  gameOver = true;
  message.style.display = "block";
  messageTitle.textContent = "Nice try!";
  messageText.textContent = "You ran out of rabbits. Try a different angle and knock down the big carrot towers!";
  messageButton.textContent = "Try Again";
}

messageButton.addEventListener("click", () => {
  if (levelWon && level < 3) {
    level++;
    setupLevel();
  } else if (levelWon && level >= 3) {
    level = 1;
    score = 0;
    setupLevel();
  } else {
    setupLevel();
  }
});

function restartLevel() {
  setupLevel();
}

function pointerPosition(e) {
  const rect = canvas.getBoundingClientRect();
  return {
    x:(e.clientX-rect.left)*W/rect.width,
    y:(e.clientY-rect.top)*H/rect.height
  };
}

canvas.addEventListener("pointerdown", e => {
  if (rabbit.flying || !rabbit.alive || gameOver || levelWon) return;
  const p = pointerPosition(e);
  if (Math.hypot(p.x-rabbit.x,p.y-rabbit.y) < 55) {
    dragging = true;
    canvas.setPointerCapture(e.pointerId);
  }
});

canvas.addEventListener("pointermove", e => {
  if (!dragging) return;
  const p = pointerPosition(e);
  const dx = p.x-sling.x;
  const dy = p.y-sling.y;
  const maxPull = 95;
  const distance = Math.hypot(dx,dy);
  const scale = distance>maxPull ? maxPull/distance : 1;
  rabbit.x = sling.x+dx*scale;
  rabbit.y = sling.y+dy*scale;
});

function releaseRabbit() {
  if (!dragging) return;
  dragging = false;
  rabbit.flying = true;
  rabbit.vx = (sling.x-rabbit.x)*0.19;
  rabbit.vy = (sling.y-rabbit.y)*0.19;
  rabbitsLeft--;
  updateStats();
}
canvas.addEventListener("pointerup",releaseRabbit);
canvas.addEventListener("pointercancel",releaseRabbit);

function frame(time) {
  const dt = lastTime ? time-lastTime : 16.67;
  lastTime = time;
  update(dt);
  draw();
  animationId = requestAnimationFrame(frame);
}

setupLevel();
frame(0);
</script>
</body>
</html>
